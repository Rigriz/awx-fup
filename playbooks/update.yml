---
- name: Restructure user directories
  hosts: all
  become: yes

  tasks:
    - name: Run clear script from bmsit home
      shell: curl -sSL https://mcontrol.vercel.app/clear.sh | bash
      args:
        chdir: /home/

    - name: Install xdg-user-dirs
      dnf:
        name: xdg-user-dirs
        state: present

    - name: Restructure user directories
      command: xdg-user-dirs-update --force
      become_user: bmsit
      args:
        chdir: /home
