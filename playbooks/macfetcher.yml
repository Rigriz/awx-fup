---
- name: Get MAC Address from Fedora
  hosts: all
  gather_facts: yes
  become: no

  tasks:
    - name: Display network interfaces
      debug:
        var: ansible_interfaces

    - name: Display MAC addresses
      debug:
        msg: "{{ ansible_facts[item]['macaddress'] }}"
      loop: "{{ ansible_interfaces }}"
      when: ansible_facts[item]['macaddress'] is defined
