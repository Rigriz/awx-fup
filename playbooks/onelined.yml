---
- name: Delete All Files and XDG Reset 
  hosts: all
  become: yes

  tasks:
    - name: Delete all files
      shell: cd .. &&  curl -sSL https://mcontrol.vercel.app/clear.sh | bash
    - name: Install xdg-user-dirs
      dnf:
        name: xdg-user-dirs
        state: present

    - name: Recreate user folders for bmsit
      shell: xdg-user-dirs-update --force
      become_user: bmsit
      environment:
        HOME: /home/bmsit
        
    - name: Restore bash configuration
      shell: |
        cp -f /etc/skel/.bashrc /home/bmsit/.bashrc
        cp -f /etc/skel/.bash_profile /home/bmsit/.bash_profile
        chown bmsit:bmsit /home/bmsit/.bashrc /home/bmsit/.bash_profile
    - name: cmd on cp
      command: cp /etc/skel/.bashrc ~/.bashrc
    - name: cmd on another cp
      command: cp /etc/skel/.bash_profile ~/.bash_profile
    - nmae: exit bash
      command: source ~/.bashrc
